name: leaderboard-ci

on:
  push:
    paths:
      - "leaderboard/**"
      - ".github/workflows/leaderboard-ci.yml"
  pull_request:
    paths:
      - "leaderboard/**"
      - ".github/workflows/leaderboard-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaderboard
          POSTGRES_PASSWORD: leaderboard
          POSTGRES_DB: leaderboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaderboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: leaderboard

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_USER: leaderboard
          TEST_DB_PASSWORD: leaderboard
        run: pytest -v