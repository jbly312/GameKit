[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-core"
version = "0.1.0"
description = "Shared infrastructure for GameKit services"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
]

[tool.setuptools.packages.find]
include = ["toolkit_core*"]
